name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bash syntax check
        run: bash -n scx-auto-profile.sh

      - name: Python syntax check
        run:         python -m py_compile linux-fan-control.py
